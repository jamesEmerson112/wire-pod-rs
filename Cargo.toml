[workspace]
resolver = "3"
members = ["crates/*", "spikes/*", "xtask"]
default-members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Member crates reference these with `.workspace = true`; adding a crate here must not change the resolved set in `Cargo.lock` until a member actually uses it.
[workspace.dependencies]
async-trait = "0.1"
axum = "0.7"
# Decoding and encoding the token and the hash. The audited crate rather than a
# hand rolled one, because base64 sits on the critical hashing path.
base64 = "0.22"
bytes = "1"
futures-core = "0.3"
# The sixteen token bytes and the sixteen salt bytes, which is what Go takes
# from `crypto/rand`.
getrandom = "0.2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "http2", "server"] }
# `tokio` is the feature `hyper_util::rt::TokioIo` lives behind, which is what the
# TLS connector hands back to tonic. `tonic` already enables exactly that one
# feature, so turning it on here adds no package.
hyper-util = { version = "0.1", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
# `localtime_r` for the local UTC offset, and `chmod` for the file modes Go
# applies. Unix only.
libc = "0.2"
mdns-sd = "0.11"
# Go embeds gopher-lua, which implements Lua 5.1, so a script written for the Go
# server needs a 5.1 host rather than a newer one. `vendored` compiles that Lua
# from source with the same C toolchain the vendored libopus already needs.
mlua = { version = "0.10", features = ["lua51", "vendored"] }
ogg = "0.9"
opus = "0.3"
prost = "0.13"
prost-types = "0.13"
protox = "0.7"
# The RNG `rsa` takes for key generation; `rsa` 0.9 speaks rand_core 0.6, which
# is what `rand` 0.8 provides.
rand = "0.8"
# The X.509 writer for the pair `CreateCertCombo` generates. Its own crypto is
# switched off: `ring` will not sign with Go's 1028-bit key, so the signing key
# is the `rsa` crate's, handed to rcgen through its `SigningKey` seam.
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
# 1028-bit RSA key generation and PKCS#1 signing, which no TLS-oriented crate
# offers at that size.
rsa = "0.9"
# The feature set spike S1 resolved with: the ring provider only, no aws-lc-rs,
# and `tls12` because Vector's gateway is old enough to need it.
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
# The constant time compare Go does with `subtle.ConstantTimeCompare`.
subtle = "2"
thiserror = "2"
# `OffsetDateTime`, which is how rcgen states a validity window, and the
# calendar arithmetic Go's `Time.AddDate` does.
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.12"
tonic-build = "0.12"
# `util` is what `ServiceExt::oneshot` lives behind, which is how the router
# tests call the router without binding a port. `tonic` already enables it, so
# every package it pulls is in `Cargo.lock` already and turning it on here adds
# none.
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs"] }
tracing = "0.1"
# The trial binary's log sink. Default features plus `env-filter` is exactly the
# feature set already resolved in `Cargo.lock`, where `extism` pulls the same
# crate in, so declaring it here activates no package the lock does not carry.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
vosk = "0.3"
walkdir = "2"
webrtc-vad = "0.4"
# Reading a generated certificate back, in the cert tests only.
x509-parser = "0.18"
# `SystemTimeToTzSpecificLocalTime` for the local UTC offset at a given instant,
# which is what Go resolves through the timezone database. Features are cfg
# gates over generated bindings inside the one crate and pull no package.
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
wirepod-audio = { path = "crates/wirepod-audio" }
wirepod-core = { path = "crates/wirepod-core" }
wirepod-intent = { path = "crates/wirepod-intent" }
wirepod-stt = { path = "crates/wirepod-stt" }
wirepod-ttr = { path = "crates/wirepod-ttr" }
wirepod-proto = { path = "crates/wirepod-proto" }
wirepod-server = { path = "crates/wirepod-server" }
wirepod-setup = { path = "crates/wirepod-setup" }
wirepod-vector = { path = "crates/wirepod-vector" }
