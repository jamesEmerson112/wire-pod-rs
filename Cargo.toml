[workspace]
resolver = "3"
members = ["crates/*", "spikes/*", "xtask"]
default-members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# Member crates reference these with `.workspace = true`; adding a crate here must not change the resolved set in `Cargo.lock` until a member actually uses it.
[workspace.dependencies]
async-trait = "0.1"
axum = "0.7"
bytes = "1"
futures-core = "0.3"
http = "1"
http-body-util = "0.1"
# `tokio` is the feature `hyper_util::rt::TokioIo` lives behind, which is what the
# TLS connector hands back to tonic. `tonic` already enables exactly that one
# feature, so turning it on here adds no package.
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.13"
prost-types = "0.13"
protox = "0.7"
# The feature set spike S1 resolved with: the ring provider only, no aws-lc-rs,
# and `tls12` because Vector's gateway is old enough to need it.
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tonic = "0.12"
tonic-build = "0.12"
# `util` is what `ServiceExt::oneshot` lives behind, which is how the router
# tests call the router without binding a port. `tonic` already enables it, so
# every package it pulls is in `Cargo.lock` already and turning it on here adds
# none.
tower = { version = "0.4", features = ["util"] }
tracing = "0.1"
walkdir = "2"
wirepod-core = { path = "crates/wirepod-core" }
wirepod-proto = { path = "crates/wirepod-proto" }
wirepod-server = { path = "crates/wirepod-server" }
wirepod-vector = { path = "crates/wirepod-vector" }
