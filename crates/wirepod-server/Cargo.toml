[package]
name = "wirepod-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes the `test_support` request and response helpers to this crate's own
# integration tests through the self dev-dependency below, and turns on
# `wirepod-core`'s fakes, which those helpers build an `AppState` from.
test-util = ["wirepod-core/test-util"]

[dependencies]
# `multipart` is for `/api-ssh/setup` alone, which is the one route on this
# surface whose body is a file upload (`ssh.go:230`).
axum = { workspace = true, features = ["multipart"] }
http.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
# `net_probe` times its round trip and `begin_event_stream` detaches its
# receiver, so the handlers need `tokio::time::timeout` and `tokio::spawn`, and
# `serve_plain` takes a `tokio::net::TcpListener`. `io-util` is on top of the
# workspace list for `tests/serve_plain.rs`, which writes a request to a socket
# by hand; it activates no dependency `Cargo.lock` does not already carry,
# because tonic enables the same feature.
tokio = { workspace = true, features = ["io-util"] }
# `CancellationToken`, which is what a `stop_event_stream` cancels. Default
# features only: `rt` would activate the optional `futures-util` dependency and
# change the lock.
tokio-util.workspace = true
tower.workspace = true
tracing.workspace = true
wirepod-core.workspace = true
# The listeners and the three gRPC services (initwirepod, servers/*, mdnshandler).
hyper.workspace = true
hyper-util = { workspace = true, features = ["server-auto", "service"] }
mdns-sd.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
tokio-rustls.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
wirepod-proto.workspace = true
image.workspace = true
reqwest.workspace = true
tower-http.workspace = true
wirepod-intent = { path = "../wirepod-intent" }
wirepod-plugins.workspace = true
wirepod-setup.workspace = true
wirepod-vector.workspace = true

[dev-dependencies]
# `tokio`, `tokio-util` and `tower` are deliberately absent: a crate's own
# `[dependencies]` are linked into its test targets too, so repeating them here
# would read as a second, independent requirement rather than the same one.
#
# The same mechanism `wirepod-core` and `wirepod-vector` use: helpers that both
# `src` and several integration-test binaries need live in `src/` behind a
# feature, and listing this crate as its own dev-dependency is what turns that
# feature on for the test build only.
wirepod-core = { workspace = true, features = ["test-util"] }
wirepod-server = { workspace = true, features = ["test-util"] }
# `tests/live_seam.rs` drives the router through the production tonic client
# against `spawn_fake_robot`, which is the only proof that the seam the handler
# tests fake is the seam the robot sees.
wirepod-vector = { workspace = true, features = ["test-util"] }
