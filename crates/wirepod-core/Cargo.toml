[package]
name = "wirepod-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Exposes the `test_support` fakes to other crates, and to this crate's own
# integration tests through the self dev-dependency below.
test-util = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
getrandom.workspace = true
# `pem.Decode` for a session certificate, which no other crate in the lock
# exposes and which is the one step before the DER walk in
# `store::session_certs`. Already resolved in `Cargo.lock` for
# `wirepod-vector`'s `test-util` feature at the same version, so this adds an
# edge and no package.
rustls-pemfile.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# The `Layer` trait the logger ring is installed as. Already resolved in
# `Cargo.lock` for `wirepod-app`, with the same workspace feature set, so this
# adds an edge and no package.
tracing-subscriber.workspace = true

# The local UTC offset at a given instant. Go resolves it through the timezone
# database; each platform has its own call for that and neither is portable.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tokio.workspace = true
tokio-util.workspace = true
# Items behind `#[cfg(test)]` are not visible from an integration test binary,
# so the fakes live behind a feature instead. Listing this crate as its own
# dev-dependency is what turns that feature on for the test build only, which
# keeps plain `cargo test` working while `cargo build` compiles none of it.
wirepod-core = { workspace = true, features = ["test-util"] }
