[package]
name = "wirepod-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "chipper"
path = "src/main.rs"

[features]
default = []
# Builds the Vosk engine into the binary, which links against libvosk. Off by
# default so a plain `cargo build` needs no native library.
stt-vosk = ["wirepod-stt/stt-vosk"]
# Builds the Windows tray: the binary uses the GUI subsystem, as Go's
# `-H=windowsgui` does, and a bare invocation starts the tray. Off by default so
# `serve` and `sdk-trial` keep their console.
tray = []

[dependencies]
serde_json.workspace = true
# `signal` is on top of the workspace list, for the Ctrl-C that stops the trial
# server. It activates `mio`, `libc`, `signal-hook-registry` and `windows-sys`,
# all four of which are already in `Cargo.lock` as tokio's dependencies, so the
# resolved package set is unchanged.
tokio = { workspace = true, features = ["signal"] }
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wirepod-core.workspace = true
wirepod-stt.workspace = true
wirepod-ttr.workspace = true
wirepod-server.workspace = true
wirepod-vector.workspace = true

# The tray shell's Win32 calls.
[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[build-dependencies]
# Compiles resources/app.rc with the Windows SDK's rc.exe; build.rs skips it off Windows.
embed-resource = "3"
