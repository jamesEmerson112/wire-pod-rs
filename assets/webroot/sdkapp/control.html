<!DOCTYPE html>
<html>

<head>
  <title>Vector Web App</title>
  <!-- Meta Apple tags for a PWA like experience. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#1e1e1e">
  <link rel="stylesheet" type="text/css" href="../css/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://kit.fontawesome.com/7508f396ac.js" crossorigin="anonymous"></script>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="Thu, 01 Jan 1970 00:00:00 GMT">
</head>

<body data-testid="bot-control-page-root" onload="updateControlButtons()">
  <div data-testid="bot-control-page-inner" id="outer">
    <div data-testid="bot-control-content-body" id="content">
      <h1 data-testid="bot-control-title-heading" class="center">Vector control (beta)</h1>
      <hr />
      <div data-testid="bot-control-nav-list" class="main-nav-parent">
        <div data-testid="bot-control-nav-back-item" class="main-nav-child">
          <a data-testid="bot-control-nav-back-link" href="#" onclick="goBackToSettings()"><i data-testid="bot-control-nav-back-icon" class="fa-solid fa-reply"></i><br />Back</a>
        </div>
      </div>
      <hr />

      <div data-testid="bot-control-actions-body" id="sdkActions">
        <h2 data-testid="bot-control-cam-heading" class="center">Camera Feed</h2>
        <hr class="small-hr">
        <div data-testid="bot-control-cam-media" class="center" id="camStream"></div>
        <div data-testid="bot-control-cam-group" style="text-align: left;" class="center">
          <label data-testid="bot-control-cam-start-label">
            <input data-testid="bot-control-cam-start-radio" type="radio" name="cam" id="cam" onclick="showCamStream()">Begin Camera Stream<br>
          </label>
          <label data-testid="bot-control-cam-stop-label">
            <input data-testid="bot-control-cam-stop-radio" type="radio" name="cam" id="cam" onclick="stopCamStream()" checked>Stop Camera Stream<br>
          </label>
        </div>
        <hr />

        <h2 data-testid="bot-control-behavior-heading" class="center">Behavior Control</h2>
        <hr class="small-hr">
        <small data-testid="bot-control-behavior-note" class="center">You must assume behavior control before performing any action</small>
        <div data-testid="bot-control-behavior-group" style="text-align: left;" class="center">
          <label data-testid="bot-control-behavior-assume-label">
            <input data-testid="bot-control-behavior-assume-radio" type="radio" name="control" id="assume_control"
              onclick="sendForm('/api-sdk/assume_behavior_control?priority=high'); updateControlButtons();">Assume<br>
          </label>
          <label data-testid="bot-control-behavior-release-label">
            <input data-testid="bot-control-behavior-release-radio" type="radio" name="control" id="release_control"
              onclick="sendForm('/api-sdk/release_behavior_control'); updateControlButtons();" checked>Release<br>
          </label>
        </div>
        <hr />

        <h2 data-testid="bot-control-keyboard-heading" class="center">Move Motors</h2>
        <hr class="small-hr">
        <small data-testid="bot-control-keyboard-note" class="center">Toggle Keyboard Controls (unstable) <br> WASD for wheels, R-lift up, F-lift down, T-head
          up, G-head down</small>
        <div data-testid="bot-control-keyboard-group" style="text-align: left;" class="center">
          <label data-testid="bot-control-keyboard-on-label">
            <input data-testid="bot-control-keyboard-on-radio" type="radio" name="keycontrol" id="key_control_on" onclick="toggleKeyboard()" disabled>On<br>
          </label>
          <label data-testid="bot-control-keyboard-off-label">
            <input data-testid="bot-control-keyboard-off-radio" type="radio" name="keycontrol" id="key_control_off" onclick="toggleKeyboard()" checked
              disabled>Off<br>
          </label>
        </div>
        <hr />

        <h2 data-testid="bot-control-mirror-heading" class="center">Mirror Mode</h2>
        <hr class="small-hr">
        <div data-testid="bot-control-mirror-group" style="text-align: left;" class="center">
          <label data-testid="bot-control-mirror-on-label">
            <input data-testid="bot-control-mirror-on-radio" type="radio" name="mirror" id="mirror_on" onclick="sendForm('/api-sdk/mirror_mode?enable=true')"
              disabled>On<br>
          </label>
          <label data-testid="bot-control-mirror-off-label">
            <input data-testid="bot-control-mirror-off-radio" type="radio" name="mirror" id="mirror_off" onclick="sendForm('/api-sdk/mirror_mode?enable=false')"
              checked disabled>Off<br>
          </label>
        </div>
        <hr />

        <h2 data-testid="bot-control-say-heading" class="center">Say Text</h2>
        <div data-testid="bot-control-say-group" class="center">
          <input data-testid="bot-control-say-input" class="tinput" name="textSay" id="textSay" type="text" placeholder="Put text here" disabled />
        </div>
        <button data-testid="bot-control-say-submit-btn" onclick="sayText()" type="submit">Submit</button>
      <hr />
      <h2 data-testid="bot-control-audio-heading" class="center">Play Audio</h2>
        <div data-testid="bot-control-audio-file-group" class="center">
          <input data-testid="bot-control-audio-file-input" type="file" id="fileInput" accept=".wav">
        </div>
        <button data-testid="bot-control-audio-send-btn" id="uploadButton" style="display: none;" type="submit">Send Audio</button>
        <div data-testid="bot-control-audio-player-group" div class="center">
          <audio data-testid="bot-control-audio-media" id="audioOutput" controls></audio>
        </div>
      </div>
      <hr />
    </div>
    </div>
  </div>
  <hr>
  </div>
  </div>

  <script src="./js/httprequest.js"></script>
  <script src="./js/iro.min.js"></script>
  <script src="./js/control.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/play_audio.js"></script>

  <iframe name="hiddenFrame" width="0" height="0" border="0" style="display: none"></iframe>
</body>

</html>
